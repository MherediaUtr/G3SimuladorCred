spring.application.name=login-usuarios
server.port=8081
# Desabilita la pagina de error por defecto de Spring Boot
server.error.whitelabel.enabled=false

# Configuración de la base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/financiera
spring.datasource.username=root
spring.datasource.password=1234

# Configuracion de JPA
spring.jpa.database=MYSQL
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true 

#Configuracion JWT
security.jwt.secret-key=GRUPO3-APLICACION-FINANCIERA-1234

#eureka client
eureka.client.service-url.defaultZone=http://localhost:8766/eureka/